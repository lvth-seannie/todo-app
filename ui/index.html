<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Retro ToDo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="tabs">
        <button id="tabToday" class="tab active">Today</button>
        <button id="tabCompleted" class="tab">Completed</button>
      </div>

      <div class="calendar">
        <div class="cal-header">
          <button id="prevMonth" class="cal-nav" aria-label="Previous month">‹</button>
          <span id="calTitle" class="cal-title">JULY 2026</span>
          <button id="nextMonth" class="cal-nav" aria-label="Next month">›</button>
        </div>

        <div class="cal-weekdays">
          <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
        </div>

        <div id="calGrid" class="cal-grid"></div>
      </div>

      <button id="todayBtn" class="jump-today">Jump to today</button>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="composer">
        <input
          id="taskInput"
          type="text"
          placeholder="What do you need to do?"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="addBtn" class="add-btn">Add</button>
      </div>

      <div class="content">
        <h1 id="sectionTitle" class="section-title">TODAY (Jul 24)</h1>
        <div id="taskList" class="task-list"></div>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
